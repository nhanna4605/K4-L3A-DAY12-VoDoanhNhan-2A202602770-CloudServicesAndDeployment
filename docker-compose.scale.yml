# ═══════════════════════════════════════════════════════════════════
# CP4 — Mở rộng tùy chọn: nhiều agent phía sau Nginx load balancer
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale agent=3
#   curl http://localhost/health          # đi qua Nginx, chia vòng tới 3 agent
#
# Vì sao cần file riêng: docker-compose.yml map cố định 8000:8000 cho agent,
# mà một cổng trên máy host chỉ gán được cho MỘT container → scale lên 3 thì
# agent-2, agent-3 lỗi "port is already allocated". File này bỏ cổng của
# agent, chỉ Nginx mở cổng 80 ra ngoài rồi chia request vào các agent.
#
# Nginx phân giải tên `agent` một lần lúc khởi động: đổi số instance thì
# chạy lại lệnh trên kèm `--force-recreate nginx` để Nginx thấy danh sách mới.
# ═══════════════════════════════════════════════════════════════════

services:
  agent:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
