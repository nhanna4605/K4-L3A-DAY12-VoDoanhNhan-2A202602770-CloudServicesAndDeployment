# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Cố ý KHÔNG đặt startCommand: với build từ Dockerfile, Railway chạy
# startCommand ở exec form (không qua shell) nên "$PORT" không được thay
# thành số cổng. Bỏ trống để Railway dùng CMD trong Dockerfile — CMD đó
# chạy qua `sh -c` và đã đọc ${PORT:-8000}.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
